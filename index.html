<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Početna - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="top-header">
        <span style="font-weight:700; letter-spacing:2px;">HEADER</span>
        <div class="d-flex gap-2 align-items-center">
            <div style="background:#f0f0f0; border-radius:6px; padding:3px 10px;">
                🔍 <input style="border:none; background:none; outline:none; width:80px; font-size:12px;" placeholder="Search">
            </div>
            <span style="background:#8B1E1E; color:white; padding:3px 12px; border-radius:20px; font-size:12px;">Korisnik</span>
        </div>
    </div>

    <div class="d-flex main-wrapper">
        <div class="sidebar">
            <div class="text-white text-center py-3 fw-bold">SIDEBAR</div>
            <a href="index.html" class="nav-item active">Home</a>
            <a href="alarmi.html" class="nav-item">Alarmi</a>
        </div>

        <div class="flex-grow-1">
            <div style="background:#8B1E1E; color:white; padding:9px 15px; font-weight:700;">DASHBOARD - POČETNA</div>
            <div class="p-4">
                
                <div id="mojKarusel" class="carousel slide mb-4 shadow-sm rounded" data-bs-ride="carousel">
                    <div class="carousel-inner rounded">
                        <div class="carousel-item active">
                            <picture>
                                <source media="(max-width: 768px)" srcset="mala1.jpg">
                                <img src="velika1.jpg" class="d-block w-100" alt="Slika 1">
                            </picture>
                        </div>
                        <div class="carousel-item">
                            <picture>
                                <source media="(max-width: 768px)" srcset="mala2.jpg">
                                <img src="velika2.jpg" class="d-block w-100" alt="Slika 2">
                            </picture>
                        </div>
                        <div class="carousel-item">
                            <picture>
                                <source media="(max-width: 768px)" srcset="mala3.jpg">
                                <img src="velika3.jpg" class="d-block w-100" alt="Slika 3">
                            </picture>
                        </div>
                        <div class="carousel-item">
                            <picture>
                                <source media="(max-width: 768px)" srcset="mala4.jpg">
                                <img src="velika4.jpg" class="d-block w-100" alt="Slika 4">
                            </picture>
                        </div>
                        <div class="carousel-item">
                            <picture>
                                <source media="(max-width: 768px)" srcset="mala5.jpg">
                                <img src="velika5.jpg" class="d-block w-100" alt="Slika 5">
                            </picture>
                        </div>
                        <div class="carousel-item">
                            <picture>
                                <source media="(max-width: 768px)" srcset="mala6.jpg">
                                <img src="velika6.jpg" class="d-block w-100" alt="Slika 6">
                            </picture>
                        </div>
                        <div class="carousel-item">
                            <picture>
                                <source media="(max-width: 768px)" srcset="mala7.jpg">
                                <img src="velika7.jpg" class="d-block w-100" alt="Slika 7">
                            </picture>
                        </div>
                        <div class="carousel-item">
                            <picture>
                                <source media="(max-width: 768px)" srcset="mala8.jpg">
                                <img src="velika8.jpg" class="d-block w-100" alt="Slika 8">
                            </picture>
                        </div>
                        <div class="carousel-item">
                            <picture>
                                <source media="(max-width: 768px)" srcset="mala9.jpg">
                                <img src="velika9.jpg" class="d-block w-100" alt="Slika 9">
                            </picture>
                        </div>
                        <div class="carousel-item">
                            <picture>
                                <source media="(max-width: 768px)" srcset="mala10.jpg">
                                <img src="velika10.jpg" class="d-block w-100" alt="Slika 10">
                            </picture>
                        </div>
                    </div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#mojKarusel" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Prethodna</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#mojKarusel" data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Sledeća</span>
                    </button>
                </div>
                <div class="row g-4">
                    <div class="col-lg-7 col-12">
                        <div class="card p-4 text-center">
                            <small class="text-muted">Sledeći alarm</small>
                            <div id="clock">--:--:--</div>
                        </div>
                        <div class="card p-4 mt-3">
                            <h6 class="mb-3">Ostalo za danas</h6>
                            <div class="alarm-row"><span>Doručak</span> <span class="pill-on">ON</span></div>
                            <div class="alarm-row"><span>Ručak</span> <span class="pill-off">OFF</span></div>
                        </div>
                    </div>
                    <div class="col-lg-5 col-12">
                        <div class="card p-4">
                            <h6 class="mb-3">Brzo dodavanje</h6>
                            <input class="form-control mb-2" placeholder="Naziv">
                            <input type="time" class="form-control mb-3">
                            <button class="btn-red">SAČUVAJ</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function updateClock() {
            const clockEl = document.getElementById('clock');
            if(clockEl) clockEl.textContent = new Date().toLocaleTimeString('sr-RS');
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
